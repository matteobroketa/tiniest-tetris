name: Pages smoke test

on:
  push:
    paths:
      - "docs/**"
      - "candidates/**"
      - "tools/verify_pages.py"
      - ".github/workflows/pages-smoke.yml"
  pull_request:
    paths:
      - "docs/**"
      - "candidates/**"
      - "tools/verify_pages.py"
      - ".github/workflows/pages-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pages-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Verify copied candidates and site references
        run: python tools/verify_pages.py
      - name: Parse browser JavaScript
        run: |
          node --check docs/app.js
          node --check docs/python-worker.js
